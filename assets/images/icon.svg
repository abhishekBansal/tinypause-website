  <rect x="2.75" y="2.75" width="42.5" height="42.5" rx="12.25" stroke="#6EE7B7" stroke-width="1.5" stroke-opacity="0.45"/>
  <circle cx="24" cy="24" r="16" fill="url(#tp-inner)"/>
  <circle cx="24" cy="24" r="16" stroke="#A7F3D0" stroke-width="1" stroke-opacity="0.25"/>
  <!-- Two Pause Bars with smooth pill caps -->
  <rect x="17.5" y="15" width="4.5" height="18" rx="2.25" fill="#FFFFFF"/>
  <rect x="26" y="15" width="4.5" height="18" rx="2.25" fill="#FFFFFF"/>
